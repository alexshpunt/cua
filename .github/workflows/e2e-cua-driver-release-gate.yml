name: "E2E: Cua Driver release gate"

# The fork's Windows and standalone Windows browser E2E lanes, without
# publishing. Full runs cover every Windows lane; PR runs use the shared
# Electron lane. Linux suites remain available through manual workflows.
#
# A PR gets the quick lane when the `e2e-gate` label is present or it touches the
# gated paths (.github/scripts/cua_driver_e2e_gate_paths.py: driver crates,
# test apps, build inputs, fixtures and this gate; docs are excluded). release-please PRs
# skip the lanes unless labelled. Otherwise the lanes are skipped and
# `E2E gate / result` passes at once, so that one check can be required on every
# PR (see scripts/ci/README.md).
#
# A full run that fails opens or updates ONE tracking issue (the nightly-report
# job). The break is already on the branch, so it is fixed forward with a new PR.
#
# Each lane retries a failed case once (scripts/ci/lib/e2e-retry-once.sh): a
# pass on the retry is reported as flaky and does not fail the gate; two
# failures do.

on:
  schedule:
    - cron: "0 6 * * *"
  # After merge: the full suite for a change to the driver, its tests or this gate.
  # The fork's integration branch is pi-computer-use; it gets the same post-merge run.
  push:
    branches: [main, pi-computer-use]
    paths:
      - "libs/cua-driver/**"
      - "scripts/ci/**"
      - ".github/scripts/cua_driver_e2e_gate_paths.py"
      - ".github/workflows/e2e-rust-*.yml"
      - ".github/workflows/e2e-cua-driver-release-gate.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# One run per PR (a new push supersedes the old one); nightly, push and manual runs
# never cancel each other (a pending push run is replaced by the newest one). A label event for an unrelated label gets its own
# group so it cannot cancel a running gate and then skip.
concurrency:
  group: >-
    e2e-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'e2e-gate' && github.run_id || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: quick
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    uses: ./.github/workflows/ci-quick.yml

  decide:
    needs: quick
    if: ${{ !failure() && !cancelled() && needs.quick.outputs.skip != 'true' }}
    name: "E2E gate / decide"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      mode: ${{ steps.decide.outputs.mode }}
      reason: ${{ steps.decide.outputs.reason }}
      lanes: ${{ steps.decide.outputs.lanes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The decision script comes from the base branch; never run PR code here.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - id: decide
        name: Decide whether the gate lanes apply
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # lanes: quick on a PR (core paths per OS), queue in the merge queue (the lanes that fit its
          # 60-minute timeout), full everywhere else.
          emit() {
            { echo "run=$1"; echo "mode=$2"; echo "reason=$3"; echo "lanes=${4:-full}"; } >> "$GITHUB_OUTPUT"
            echo "gate: run=$1 mode=$2 lanes=${4:-full} ($3)"
          }
          # The files two commits differ in, or nothing when that cannot be read in full: an API error on
          # any page, or 300 files, where the compare API stops listing them.
          compare_files() {
            local out
            out=$(gh api --paginate "repos/$REPO/compare/$1...$2" --jq '.files[].filename' 2>/dev/null) || return 0
            (( $(grep -c . <<< "$out") < 300 )) || return 0
            printf '%s\n' "$out"
          }
          if [[ "$EVENT" == push ]]; then
            # Post-merge: the full suite when the pushed commits touch a gated path. The paths
            # filter of the trigger is broad (all of libs/cua-driver); this narrows it to the
            # globs the PR gate uses. Anything we cannot read runs the suite.
            files=$(compare_files "$PUSH_BEFORE" "$PUSH_AFTER")
            if [[ -z "$files" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
              emit true post-merge "push to ${GITHUB_REF_NAME}, changed files unreadable"; exit 0
            fi
            if [[ ! -f .github/scripts/cua_driver_e2e_gate_paths.py ]]; then
              emit true post-merge "push to ${GITHUB_REF_NAME}, path script missing"; exit 0
            fi
            matched=$(python3 .github/scripts/cua_driver_e2e_gate_paths.py <<< "$files" | head -n 5)
            if [[ -n "$matched" ]]; then
              emit true post-merge "push touching gated paths, e.g. $(head -n 1 <<< "$matched")"
            else
              emit false post-merge "push without gated paths"
            fi
            exit 0
          fi
          if [[ "$EVENT" == merge_group ]]; then
            # The merged result of the queued pull requests, when they touch a gated path. Anything we
            # cannot read runs the lanes.
            files=$(compare_files "$QUEUE_BASE" "$QUEUE_HEAD")
            if [[ -z "$files" || ! -f .github/scripts/cua_driver_e2e_gate_paths.py ]]; then
              emit true queue "merge queue, changed files unreadable" queue; exit 0
            fi
            matched=$(python3 .github/scripts/cua_driver_e2e_gate_paths.py <<< "$files" | head -n 5)
            if [[ -n "$matched" ]]; then
              emit true queue "merge queue touching gated paths, e.g. $(head -n 1 <<< "$matched")" queue
            else
              emit false queue "merge queue without gated paths"
            fi
            exit 0
          fi
          if [[ "$EVENT" != pull_request ]]; then
            emit true "$([[ $EVENT == schedule ]] && echo nightly || echo manual)" "$EVENT on ${GITHUB_REF_NAME}"
            exit 0
          fi
          if jq -e 'index("e2e-gate")' <<< "$PR_LABELS" >/dev/null; then
            emit true pr "label e2e-gate" quick; exit 0
          fi
          if [[ "$PR_DRAFT" == true ]]; then
            emit false pr "draft PR without the e2e-gate label"; exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          if [[ "$PR_HEAD_REPO" == "$REPO" && "$PR_HEAD_REF" == release-please--branches--* ]]; then
            # Release PRs only change versions, changelogs and lockfiles. The
            # tag run in cd-rust-cua-driver.yml runs every lane on the exact
            # release commit and blocks publishing, so the PR skips them.
            # Add the e2e-gate label to run the lanes on a release PR anyway.
            emit false pr "release-please PR (the tag release gate runs the lanes)"; exit 0
          fi
          if [[ ! -f .github/scripts/cua_driver_e2e_gate_paths.py ]]; then
            # Bootstrap: the base branch does not carry the path script until
            # this workflow merges. Label, schedule and release PRs still gate.
            emit false pr "path script not on the default branch yet"; exit 0
          fi
          matched=$(python3 .github/scripts/cua_driver_e2e_gate_paths.py <<< "$files" | head -n 5)
          if [[ -n "$matched" ]]; then
            emit true pr "gated paths, e.g. $(head -n 1 <<< "$matched")" quick; exit 0
          fi
          emit false pr "no gated paths and no e2e-gate label"

  windows:
    name: "gate / Windows E2E"
    needs: [quick, decide]
    if: ${{ !failure() && !cancelled() && needs.decide.outputs.run == 'true' && needs.quick.outputs.skip != 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e-rust-windows.yml
    with:
      ref: ${{ github.sha }}
      # Queue: every lane but the shared Electron + Tauri one (up to 54 minutes), which the PR's
      # quick lane ran and the full run after merge runs.
      lane: ${{ needs.decide.outputs.lanes == 'quick' && 'shared' || needs.decide.outputs.lanes == 'queue' && 'native,capture,installer' || 'all' }}
      harness_filter: ${{ needs.decide.outputs.lanes == 'quick' && 'electron' || '' }}

  browsers:
    name: "gate / standalone browser E2E"
    needs: [quick, decide]
    # Full runs only: the quick PR lane and the merge queue (40 to 53 minutes, too close to its
    # 60-minute timeout) leave the browser lanes to the run after merge.
    if: ${{ !failure() && !cancelled() && needs.decide.outputs.run == 'true' && needs.decide.outputs.lanes != 'quick' && needs.decide.outputs.lanes != 'queue' && needs.quick.outputs.skip != 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e-rust-standalone-browsers.yml
    with:
      ref: ${{ github.sha }}
      platform: windows

  # The single check to require in branch protection. Skipped lanes pass
  # (path-based requirement); gated PRs need every lane green.
  # quick runs only on pull_request and merge_group, so every other event reports it skipped.
  result:
    name: "E2E gate / result"
    if: ${{ always() && needs.quick.outputs.skip != 'true' }}
    needs: [quick, decide, windows, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate lanes
        env:
          RUN: ${{ needs.decide.outputs.run }}
          LANES_SIZE: ${{ needs.decide.outputs.lanes }}
          EVENT: ${{ github.event_name }}
          DECIDE: ${{ needs.decide.result }}
          LANES: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [[ "$DECIDE" != success ]]; then
            echo "::error::gate decision job ${DECIDE}"; exit 1
          fi
          if [[ "$RUN" != true ]]; then
            echo "Release-gate lanes not required for this change." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bad=$(jq -r 'to_entries[] | select(.key != "decide") | select(.value.result != "success") | select((.key != "quick" or .value.result != "skipped" or env.EVENT == "pull_request" or env.EVENT == "merge_group") and (.key != "browsers" or .value.result != "skipped" or (env.LANES_SIZE != "quick" and env.LANES_SIZE != "queue"))) | "\(.key)=\(.value.result)"' <<< "$LANES")
          if [[ -n "$bad" ]]; then
            echo "::error::release-gate lanes not green: $bad"; exit 1
          fi
          echo "All release-gate lanes passed." | tee -a "$GITHUB_STEP_SUMMARY"

  # Nightly and post-merge full runs: keep ONE tracking issue up to date (same
  # pattern as release-pipeline-guard.yml). Fails when the gate failed so the run is
  # red in #releases via the GitHub Slack app subscription, and workflow-failure-alerts
  # posts it to Alertmanager.
  nightly-report:
    name: "E2E gate / nightly report"
    # A post-merge push without gated paths runs no lanes (decide.run == false): every lane
    # is then `skipped`, which is not a failure, so there is nothing to report.
    if: ${{ always() && needs.decide.outputs.run == 'true' && (needs.decide.outputs.mode == 'nightly' || needs.decide.outputs.mode == 'post-merge') && needs.quick.outputs.skip != 'true' }}
    needs: [quick, decide, windows, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: scripts/ci
      - name: Download lane evidence (flaky records)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: rust-*
          path: lane-evidence
        continue-on-error: true
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LANES: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          MODE: ${{ needs.decide.outputs.mode }}
        run: |
          set -euo pipefail
          TITLE="Cua Driver release gate failing on ${GITHUB_REF_NAME} (nightly)"
          mkdir -p lane-evidence
          failed=$(jq -r 'to_entries[] | select(.key != "decide") | select(.value.result != "success") | select(.key != "quick" or .value.result != "skipped") | "- `\(.key)`: \(.value.result)"' <<< "$LANES")
          flaky=$(scripts/ci/summarize-flaky-cases.sh lane-evidence)
          existing=$(gh issue list -R "$REPO" --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[]|select(.title==\"$TITLE\")][0].number // empty")
          if [[ -z "$failed" && -z "$flaky" ]]; then
            echo "Release gate green." | tee -a "$GITHUB_STEP_SUMMARY"
            [[ -z "$existing" ]] || gh issue close "$existing" -R "$REPO" -c "The release gate is green on ${SHA:0:12} ($RUN_URL)."
            exit 0
          fi
          if [[ -n "$failed" ]]; then status="FAILING"; else status="passing, with flaky cases"; fi
          body="Cua Driver release gate (${MODE:-nightly} full run) on ${GITHUB_REF_NAME} @ \`${SHA:0:12}\` is **${status}** ($(date -u +%FT%TZ), [run]($RUN_URL))."$'\n\n'
          if [[ -n "$failed" ]]; then
            body+="### Failed lanes"$'\n\n'"$failed"$'\n\n'"A case counts as failed only after a retry also failed. This suite runs after merge, so the break is already on the default branch: fix it forward with a new PR."$'\n\n'
          fi
          [[ -z "$flaky" ]] || body+="$flaky"$'\n\n'
          body+="This issue is updated by \`.github/workflows/e2e-cua-driver-release-gate.yml\` and closes itself on the first fully clean full run."
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$body"
          fi
          if [[ -n "$failed" ]]; then
            echo "::error::Nightly release gate failed"
            exit 1
          fi
