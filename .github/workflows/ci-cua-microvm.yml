name: "CI: microVMs"

# The microVM backend (cua-vmm microvm/, the guest init, cua-vz) and its
# placement:
#   unit       Linux: the backend's, the init's and placement's unit tests;
#              the static guest init for both architectures.
#   macos      hosted macOS: cua-vz's Swift tests and signed build, the
#              backend's unit tests on a Mac (vz.json, gvproxy config,
#              process lookups), the aarch64 guest init built there the way
#              the release builds it, and the perf guard's own tests.
#   vz-e2e     nightly, on a self-hosted Apple silicon Mac
#              (vars.CUA_E2E_LUME_RUNNER; hosted runners cannot nest VMs):
#              a real microVM Space checkpointed, restored and forked 8
#              times (tests/e2e/local-runtimes/tests/microvm_vz.rs), then the
#              perf guard (libs/cua/bench/microvm-fork) through the CLI
#              against its committed baseline.

on:
  pull_request:
    paths:
      - "libs/cua/crates/cua-vmm/**"
      - "libs/cua/crates/cua-microvm-init/**"
      - "libs/cua/crates/cua-sandbox-core/src/placement.rs"
      - "libs/cua/vz/**"
      - "libs/cua/bench/microvm-fork/**"
      - "tests/e2e/local-runtimes/tests/microvm_vz.rs"
      - ".github/workflows/ci-cua-microvm.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua/crates/cua-vmm/**"
      - "libs/cua/crates/cua-microvm-init/**"
      - "libs/cua/crates/cua-sandbox-core/src/placement.rs"
      - "libs/cua/vz/**"
      - "libs/cua/bench/microvm-fork/**"
      - ".github/workflows/ci-cua-microvm.yml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cua-microvm-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  unit:
    name: unit (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: libs-cua-vmm
      - name: Format
        run: cargo fmt -p cua-vmm -p cua-microvm-init -- --check
      - name: Clippy
        run: cargo clippy --locked -p cua-vmm -p cua-microvm-init --all-targets -- -D warnings
      - name: Test (backend, init, placement)
        run: |
          cargo test --locked -p cua-microvm-init
          cargo test --locked -p cua-vmm --lib microvm
          cargo test --locked -p cua-sandbox-core --lib placement
      - name: The guest init is static (both architectures)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo build --locked --release -p cua-microvm-init --target "$t"
            if file "target/$t/release/cua-microvm-init" | grep -q interpreter; then
              echo "::error::cua-microvm-init ($t) is dynamically linked"; exit 1
            fi
          done
