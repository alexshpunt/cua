name: Windows fork build

on:
  push:
    branches:
      - feat/lpt-730-coordinate-scroll
      - feat/lpt-703-window-restore
      - feat/lpt-731-window-management
      - feat/lpt-733-window-dom-inspection
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to build
        required: true
        type: string
      generate_bindings:
        description: Generate owned SDK bindings after Windows checks; no Linux GUI qualification
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-fork-build
  cancel-in-progress: false

env:
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: libs/cua-driver/rust
    steps:
      - name: Validate source revision
        working-directory: .
        env:
          SOURCE_REF: ${{ env.SOURCE_REF }}
        run: |
          if ($env:SOURCE_REF -notmatch '^[0-9a-f]{40}$') {
            throw 'source_ref must be an exact commit SHA'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1, same as the upstream release
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            libs/cua-driver/rust/target
          key: windows-fork-rust-1.97.1-${{ hashFiles('libs/cua-driver/rust/Cargo.lock', 'libs/cua-driver/rust/**/Cargo.toml') }}
      - name: Record build environment
        run: |
          New-Item -ItemType Directory -Force -Path build-evidence | Out-Null
          git rev-parse HEAD | Set-Content build-evidence/source-sha.txt
          rustc --version --verbose | Tee-Object build-evidence/rustc.txt
          cargo --version | Tee-Object build-evidence/cargo.txt
          rustup show active-toolchain | Tee-Object build-evidence/toolchain.txt
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json |
            Set-Content build-evidence/msvc-installation.json
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio discovery failed' }
      - name: Run hermetic owner tests
        env:
          CUA_DRIVER_RS_TELEMETRY_ENABLED: "false"
        run: |
          cargo test --locked -p cua-driver-contract -p cua-driver-core -p cua-driver-sdk -p platform-windows --lib 2>&1 |
            Tee-Object build-evidence/tests.log
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed: $LASTEXITCODE" }
      - name: Run native pointer contract and execution tests
        env:
          CUA_DRIVER_RS_TELEMETRY_ENABLED: "false"
        run: |
          cargo test --locked -p cua-driver-contract --test pointer_contract 2>&1 |
            Tee-Object build-evidence/pointer-contract-tests.log
          if ($LASTEXITCODE -ne 0) { throw "pointer contract tests failed: $LASTEXITCODE" }
          cargo test --locked -p cua-driver-core --test pointer_execution 2>&1 |
            Tee-Object build-evidence/pointer-execution-tests.log
          if ($LASTEXITCODE -ne 0) { throw "pointer execution tests failed: $LASTEXITCODE" }
      - name: Run coordinate scroll contract and execution tests
        env:
          CUA_DRIVER_RS_TELEMETRY_ENABLED: "false"
        run: |
          cargo test --locked -p cua-driver-contract --test scroll_contract 2>&1 |
            Tee-Object build-evidence/scroll-contract-tests.log
          if ($LASTEXITCODE -ne 0) { throw "scroll contract tests failed: $LASTEXITCODE" }
          cargo test --locked -p cua-driver-core --test scroll_execution 2>&1 |
            Tee-Object build-evidence/scroll-execution-tests.log
          if ($LASTEXITCODE -ne 0) { throw "scroll execution tests failed: $LASTEXITCODE" }
      - name: Run window restore contract and execution tests
        env:
          CUA_DRIVER_RS_TELEMETRY_ENABLED: "false"
        run: |
          cargo test --locked -p cua-driver-contract --test window_restore_contract 2>&1 |
            Tee-Object build-evidence/window-restore-contract-tests.log
          if ($LASTEXITCODE -ne 0) { throw "window restore contract tests failed: $LASTEXITCODE" }
          cargo test --locked -p cua-driver-core --test window_restore_execution 2>&1 |
            Tee-Object build-evidence/window-restore-execution-tests.log
          if ($LASTEXITCODE -ne 0) { throw "window restore execution tests failed: $LASTEXITCODE" }
      - name: Run window management contract and execution tests
        env:
          CUA_DRIVER_RS_TELEMETRY_ENABLED: "false"
        run: |
          cargo test --locked -p cua-driver-contract --test window_management_contract 2>&1 |
            Tee-Object build-evidence/window-management-contract-tests.log
          if ($LASTEXITCODE -ne 0) { throw "window management contract tests failed: $LASTEXITCODE" }
          cargo test --locked -p cua-driver-core --test window_management_execution 2>&1 |
            Tee-Object build-evidence/window-management-execution-tests.log
          if ($LASTEXITCODE -ne 0) { throw "window management execution tests failed: $LASTEXITCODE" }
      - name: Check native DOM pixel proof consumer when present
        if: hashFiles('libs/cua-driver/rust/crates/cua-driver-core/examples/dom_pixel_proof.rs') != ''
        run: |
          cargo test --locked -p cua-driver-core --example dom_pixel_proof 2>&1 |
            Tee-Object build-evidence/dom-pixel-proof-tests.log
          if ($LASTEXITCODE -ne 0) { throw "DOM pixel proof tests failed: $LASTEXITCODE" }
      - name: Build isolated persistent WGC probe when present
        if: hashFiles('libs/cua-driver/rust/crates/platform-windows/examples/persistent-wgc-probe.rs') != ''
        run: |
          cargo test --locked -p platform-windows --example persistent-wgc-probe 2>&1 |
            Tee-Object build-evidence/persistent-wgc-tests.log
          if ($LASTEXITCODE -ne 0) { throw "probe policy tests failed: $LASTEXITCODE" }
          cargo build --locked -p platform-windows --example persistent-wgc-probe --release --target x86_64-pc-windows-msvc 2>&1 |
            Tee-Object build-evidence/persistent-wgc-build.log
          if ($LASTEXITCODE -ne 0) { throw "probe build failed: $LASTEXITCODE" }
          $probe = 'build-evidence/probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/examples/persistent-wgc-probe.exe' "$probe/persistent-wgc-probe.exe"
          Get-FileHash "$probe/persistent-wgc-probe.exe" -Algorithm SHA256 |
            Select-Object @{Name='name';Expression={Split-Path $_.Path -Leaf}}, Hash |
            ConvertTo-Json | Set-Content build-evidence/probe-hash.json
          'Read-only experiment. Not a Driver runtime. No capture or input qualification.' |
            Set-Content "$probe/BUILD-NOTICE.txt"
      - name: Run protocol and schema tests
        env:
          CUA_DRIVER_RS_TELEMETRY_ENABLED: "false"
        run: |
          cargo test --locked -p cua-driver --test protocol_schema_test --test schema_consistency_test 2>&1 |
            Tee-Object build-evidence/protocol-tests.log
          if ($LASTEXITCODE -ne 0) { throw "protocol tests failed: $LASTEXITCODE" }
      - name: Build candidate source
        run: |
          cargo build --locked -p cua-driver -p cursor-theme-cli -p cua-driver-uia --release --target x86_64-pc-windows-msvc 2>&1 |
            Tee-Object build-evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed: $LASTEXITCODE" }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'The build changed tracked source' }
      - name: Check and package the unsigned candidate
        run: |
          $release = 'target/x86_64-pc-windows-msvc/release'
          & "$release/cua-driver.exe" --version 2>&1 | Tee-Object build-evidence/version.txt
          if ($LASTEXITCODE -ne 0) { throw 'Built driver version check failed' }
          & "$release/cua-driver.exe" --help 2>&1 | Set-Content build-evidence/help.txt
          if ($LASTEXITCODE -ne 0) { throw 'Built driver help check failed' }
          $bundle = 'build-evidence/runtime'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          foreach ($name in 'cua-driver.exe', 'cua-cursor-theme.exe', 'cua-driver-uia.exe') {
            Copy-Item "$release/$name" "$bundle/$name"
          }
          Copy-Item '../../../LICENSE.md' "$bundle/LICENSE.md"
          Copy-Item 'THIRD_PARTY_NOTICES.md' "$bundle/THIRD_PARTY_NOTICES.md"
          Get-ChildItem "$bundle/*.exe" | Get-FileHash -Algorithm SHA256 |
            Select-Object @{Name='name';Expression={Split-Path $_.Path -Leaf}}, Hash |
            ConvertTo-Json | Set-Content build-evidence/hashes.json
          Get-ChildItem "$bundle/*.exe" | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            [pscustomobject]@{name=$_.Name;signature_status=[string]$signature.Status}
          } | ConvertTo-Json | Set-Content build-evidence/signatures.json
          'Unsigned research build. This is not an installed or qualified runtime; UIAccess signing is not established.' |
            Set-Content "$bundle/BUILD-NOTICE.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fork-build-${{ env.SOURCE_REF }}
          path: libs/cua-driver/rust/build-evidence/
          if-no-files-found: error
          retention-days: 14

  generate-bindings:
    name: Generate owned SDK bindings (no Linux GUI qualification)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.generate_bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends \
            clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libei-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: libs/cua-driver/typescript/package-lock.json
      - name: Install locked TypeScript SDK dependencies
        working-directory: libs/cua-driver/typescript
        run: npm ci
      - name: Generate and check owned UniFFI bindings
        id: generate
        run: |
          set -euo pipefail
          bundle='.tmp/sdk-bindings-generation'
          mkdir -p "$bundle"
          source=$(git rev-parse HEAD)
          test "$source" = "$SOURCE_REF"
          printf '%s\n' "$source" > "$bundle/source-sha.txt"
          node libs/cua-driver/scripts/generate-uniffi-bindings.mjs 2>&1 | tee "$bundle/generation.log"
          node libs/cua-driver/scripts/generate-uniffi-bindings.mjs --check 2>&1 | tee -a "$bundle/generation.log"
      - name: Check generated TypeScript and Python syntax
        run: |
          set -euo pipefail
          log='.tmp/sdk-bindings-generation/generation.log'
          npm --prefix libs/cua-driver/typescript run typecheck 2>&1 | tee -a "$log"
          python -m py_compile \
            libs/cua-driver/python/src/cua_driver/_native.py \
            libs/cua-driver/python/src/cua_driver/_native_contract.py \
            libs/cua-driver/python/src/cua_driver/__init__.py 2>&1 | tee -a "$log"
      - name: Stage only owned generated files
        id: stage
        if: always() && steps.generate.outcome == 'success'
        run: |
          set -euo pipefail
          bundle='.tmp/sdk-bindings-generation'
          files=(
            libs/cua-driver/python/src/cua_driver/_native.py
            libs/cua-driver/python/src/cua_driver/_native_contract.py
            libs/cua-driver/python/.cua-driver-uniffi-generated-files
            libs/cua-driver/typescript/src/native/cua_driver_contract-ffi.ts
            libs/cua-driver/typescript/src/native/cua_driver_contract.ts
            libs/cua-driver/typescript/src/native/cua_driver_sdk-ffi.ts
            libs/cua-driver/typescript/src/native/cua_driver_sdk.ts
            libs/cua-driver/typescript/src/native/index.ts
            libs/cua-driver/typescript/.cua-driver-uniffi-generated-files
          )
          total=0
          for file in "${files[@]}"; do
            test -f "$file" && test ! -L "$file"
            size=$(stat -c '%s' "$file")
            test "$size" -le 10485760
            total=$((total + size))
            install -D -m 0644 "$file" "$bundle/$file"
          done
          total=$((total + $(stat -c '%s' "$bundle/source-sha.txt") + $(stat -c '%s' "$bundle/generation.log")))
          test "$total" -le 26214400
      - uses: actions/upload-artifact@v4
        if: always() && steps.stage.outcome == 'success'
        with:
          name: owned-sdk-bindings-${{ env.SOURCE_REF }}
          path: .tmp/sdk-bindings-generation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
