name: "Nightly: Cua Driver"

# Fork CI validates the scheduled default-branch revision without publishing
# release artifacts or requiring macOS signing credentials.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-cua-driver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    uses: ./.github/workflows/e2e-rust-linux.yml
    with:
      ref: ${{ github.sha }}

  windows:
    uses: ./.github/workflows/e2e-rust-windows.yml
    with:
      ref: ${{ github.sha }}

  browsers:
    uses: ./.github/workflows/e2e-rust-standalone-browsers.yml
    with:
      ref: ${{ github.sha }}
